# Tooling aligned to the Home Assistant Python floor (>=3.14.0).

[project]
name = "pollenlevels"
version = "3.0.2"
# Enforce the runtime floor aligned with Home Assistant Python 3.14 images.
requires-python = ">=3.14"

[dependency-groups]
lint = [
    "ruff==0.16.2",
]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "aiointercept==0.1.9",
    "packaging==26.3",
    "pytest-homeassistant-custom-component==0.13.354",
    "homeassistant==2026.8.0",
]
release = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.uv]
# renovate: datasource=github-releases depName=astral-sh/uv
required-version = "==0.12.3"
default-groups = []
# Keep transitive packages behind the same supply-chain cooldown as Renovate.
exclude-newer = "3 days"
# Home Assistant 2026.8.0 requires Python 3.14.2+, while CI itself uses the
# exact patch from .python-version. Keep the lock within the supported 3.14 line.
environments = ["python_full_version >= '3.14.2' and python_full_version < '3.15'"]

[tool.ruff]
line-length = 88
# Match runtime: Python 3.14
target-version = "py314"
preview = false
# Do not set a default global 'fix' here; workflows control fixing with CLI flags.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
preview = false

[tool.ruff.lint]
# Core rule sets: pycodestyle/pyflakes/isort/pyupgrade/bugbear
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E203", # Whitespace before ':' in slicing
  "E501", # Line length (Ruff formatter handles wrapping)
]

[tool.ruff.lint.isort]
# IMPORTANT: first-party must match this integration's package
known-first-party = ["custom_components.pollenlevels"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# --- Optional hardening (uncomment if needed) ---
