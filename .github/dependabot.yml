# Renovate owns routine dependency and GitHub Actions updates; Dependabot
# is retained for security alerts, without duplicate version-update PRs.
# The HA/official-pytest pair is owner-managed by the scheduled pair updater.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant"
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      - dependency-name: "uv"
