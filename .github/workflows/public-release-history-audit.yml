name: Pre-publication Git history secret audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-release-history-audit.yml"
      - ".gitleaksignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-publication-history-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history-secrets:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install audited Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          # Same reviewed v8.30.1 commit as pr-secret-scan.yml.
          GOTOOLCHAIN=auto go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e
          "$(go env GOPATH)/bin/gitleaks" version

      - name: Audit reachable branches, tags and PR history
        shell: bash
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/history-audit.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          audit="$scratch/history.git"
          report="$scratch/findings.json"
          [[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]

          # Public repository: fetch objects anonymously, with no checkout,
          # persistent credentials, PR-controlled configuration or raw ref logs.
          git init --bare -q "$audit"
          if ! git -C "$audit" fetch --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/audit/pull/*' >/dev/null 2>&1; then
            echo "::error::Historical ref fetch failed; no audit result."
            exit 1
          fi
          git -C "$audit" symbolic-ref HEAD refs/heads/main
          git -C "$audit" cat-file -e "$POLICY_SHA^{commit}"
          git -C "$audit" merge-base --is-ancestor "$POLICY_SHA" refs/heads/main
          printf 'Branch refs: %s; tag refs: %s; PR head refs: %s; reachable commits: %s\n' \
            "$(git -C "$audit" for-each-ref --format='%(objectname)' refs/heads | wc -l)" \
            "$(git -C "$audit" for-each-ref --format='%(objectname)' refs/tags | wc -l)" \
            "$(git -C "$audit" for-each-ref --format='%(objectname)' refs/audit/pull | wc -l)" \
            "$(git -C "$audit" rev-list --all --count)"

          # Use embedded rules and no historical exceptions. Any future
          # exception policy requires its own reviewed workflow change.
          printf '%s\n' '[extend]' 'useDefault = true' > "$scratch/rules.toml"
          touch "$scratch/approved-ignore"
          echo "Historical exception policy: none."

          scan_rc=0
          "$(go env GOPATH)/bin/gitleaks" git \
            --no-banner --redact=100 --exit-code=23 \
            --config="$scratch/rules.toml" \
            --gitleaks-ignore-path="$scratch/approved-ignore" \
            --ignore-gitleaks-allow \
            --report-format=json --report-path="$report" \
            --log-opts="--all --diff-merges=first-parent --text --no-ext-diff --no-textconv" \
            "$audit" >/dev/null 2>&1 || scan_rc=$?

          case "$scan_rc" in
            0|23) ;;
            *)
              echo "::error::Historical scan did not complete (exit $scan_rc)."
              exit 1 ;;
          esac

          # Only aggregate counts leave this runner. Even file names, paths,
          # commit messages and rule excerpts can contain sensitive material.
          python3 - "$report" "$scan_rc" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  findings = json.load(stream)
              if findings is None:
                  findings = []
              if not isinstance(findings, list):
                  raise ValueError
              if (int(sys.argv[2]) == 23) != bool(findings):
                  raise ValueError
          except (OSError, ValueError, TypeError):
              print("::error::Missing or inconsistent historical audit report.")
              sys.exit(1)
          print(f"Unexcepted findings requiring private review: {len(findings)}")
          PY

          if [[ "$scan_rc" == 23 ]]; then
            echo "::error::Potential historical secrets detected. Review privately; revoke or rotate any real credentials."
            exit 1
          fi
          echo "No unexcepted findings in fetched reachable history."
