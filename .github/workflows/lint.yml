name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit to lint (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Python 3.14 (latest patch)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "ruff>=0.15"
          ruff --version

      - name: Ruff lint
        shell: bash
        run: |
          set -euo pipefail
          ruff check .

      - name: Ruff format
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check .
