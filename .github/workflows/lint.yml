name: Lint

on:
  push:
    branches: [main, prep/5.0-ha-2026.10.4]
  pull_request:
    branches: [main, prep/5.0-ha-2026.10.4]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit to lint (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock
          cache-suffix: lint

      - name: Verify locked lint environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group lint

      - name: Ruff lint
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync ruff check .

      - name: Ruff format
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync ruff format --check .
