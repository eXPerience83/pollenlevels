name: Lint

on:
  push:
    branches: [main, prep/5.0-ha-2026.10.4]
  pull_request:
    branches: [main, prep/5.0-ha-2026.10.4]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit to lint (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock
          cache-suffix: lint

      - name: Time-bounded 2026.11 GA dependency bootstrap
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly permit the reviewed exact 2026.11 GA lock while its
          # releases have not yet aged through the normal three-day cooldown.
          # This exception automatically expires; the repository's default
          # exclude-newer = "3 days" and updater maturity policy stay intact.
          if (( $(date -u +%s) < $(date -u -d '2026-11-10T00:00:00Z' +%s) )); then
            printf 'UV_EXCLUDE_NEWER=false\n' >> "$GITHUB_ENV"
            echo "Temporary GA bootstrap active for the exact committed lock."
          fi

      - name: Verify locked lint environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group lint

      - name: Ruff lint
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync ruff check .

      - name: Ruff format
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync ruff format --check .

      - name: TEMPORARY format diagnostic (remove before merge)
        if: always()
        shell: bash
        run: |
          uv run --locked --no-sync ruff format --diff tests/test_ha_persisted_upgrade.py
