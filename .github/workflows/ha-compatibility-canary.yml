name: Latest Home Assistant Compatibility Canary

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-compatibility-canary
  cancel-in-progress: true

env:
  UV_NO_CACHE: "1"

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Create disposable environment
        shell: bash
        run: |
          set -euo pipefail
          canary_venv="$RUNNER_TEMP/ha-compatibility-canary-venv"
          uv venv --python "$(command -v python)" "$canary_venv"
          printf 'CANARY_PYTHON=%s\n' "$canary_venv/bin/python" >> "$GITHUB_ENV"

      - name: Read current auxiliary test requirements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          requirements = project["dependency-groups"]["test"]
          selected = {}
          for requirement in requirements:
              if isinstance(requirement, str):
                  for name in ("aiointercept", "packaging"):
                      if requirement.startswith(f"{name}=="):
                          selected[name] = requirement
          missing = {"aiointercept", "packaging"} - selected.keys()
          if missing:
              raise SystemExit(f"Missing exact canary helper requirements: {sorted(missing)}")
          for name, requirement in selected.items():
              print(f"{name.upper()}_REQUIREMENT={requirement}")
          PY

      - name: Install stable-harness selection helper requirement
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --python "$CANARY_PYTHON" "$PACKAGING_REQUIREMENT"

      - name: Select latest stable Home Assistant harness pair
        shell: bash
        run: |
          set -euo pipefail
          selection_file="$RUNNER_TEMP/ha-harness-selection.json"
          "$CANARY_PYTHON" scripts/select_ha_harness.py > "$selection_file"
          "$CANARY_PYTHON" - "$selection_file" <<'PY' >> "$GITHUB_ENV"
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              selection = json.load(file)
          fields = {
              "LATEST_HA": selection["latest_homeassistant"],
              "LATEST_OFFICIAL": selection["latest_official"],
              "SELECTED_HA": selection["selected_homeassistant"],
              "SELECTED_OFFICIAL": selection["selected_official"],
              "SKIPPED_PRERELEASE_OFFICIAL": ",".join(
                  selection["skipped_prerelease_official"]
              ),
          }
          for name, value in fields.items():
              print(f"{name}={value}")
          PY

      - name: Install selected stable Home Assistant harness pair
        shell: bash
        env:
          UV_EXCLUDE_NEWER: "false"
        run: |
          set -euo pipefail
          uv pip install --python "$CANARY_PYTHON" \
            "pytest-homeassistant==$SELECTED_OFFICIAL" \
            "$AIOINTERCEPT_REQUIREMENT"
          uv pip check --python "$CANARY_PYTHON"

      - name: Report resolved compatibility versions
        shell: bash
        run: |
          set -euo pipefail
          "$CANARY_PYTHON" - <<'PY'
          import importlib.metadata
          import os
          import subprocess

          from packaging.version import Version

          from scripts.select_ha_harness import exact_homeassistant_requirement

          names = (
              "pytest-homeassistant",
              "homeassistant",
              "pytest",
              "pytest-asyncio",
              "aiointercept",
              "packaging",
          )
          versions = {
              name: importlib.metadata.version(name)
              for name in names
          }
          official_metadata = importlib.metadata.metadata("pytest-homeassistant")
          urls = official_metadata.get_all("Project-URL") or []
          if not any("github.com/home-assistant/core" in url for url in urls):
              raise SystemExit("Installed pytest-homeassistant lacks official Core provenance")
          installed_names = {
              dist.metadata["Name"].lower().replace("_", "-")
              for dist in importlib.metadata.distributions()
          }
          if "pytest-homeassistant-custom-component" in installed_names:
              raise SystemExit("The official plugin cannot coexist with PHACC")

          installed_official = versions["pytest-homeassistant"]
          installed_homeassistant = versions["homeassistant"]
          if installed_official != os.environ["SELECTED_OFFICIAL"]:
              raise SystemExit(
                  f"Installed OFFICIAL {installed_official} does not match selected "
                  f"{os.environ['SELECTED_OFFICIAL']}"
              )
          if installed_homeassistant != os.environ["SELECTED_HA"]:
              raise SystemExit(
                  f"Installed Home Assistant {installed_homeassistant} does not match "
                  f"selected {os.environ['SELECTED_HA']}"
              )
          required_homeassistant = exact_homeassistant_requirement(
              importlib.metadata.requires("pytest-homeassistant")
          )
          if required_homeassistant != installed_homeassistant:
              raise SystemExit(
                  "OFFICIAL Home Assistant requirement is not the exact installed version: "
                  f"{required_homeassistant} != {installed_homeassistant}"
              )

          latest_ha = os.environ["LATEST_HA"]
          aligned = Version(installed_homeassistant) == Version(latest_ha)
          if aligned:
              status = "latest stable Home Assistant is covered by the canary"
          else:
              status = (
                  "upstream OFFICIAL has not yet caught up with latest Home Assistant"
              )
              print(
                  "::warning title=Home Assistant harness lag::"
                  f"Latest stable Home Assistant is {latest_ha}, but OFFICIAL "
                  f"{installed_official} selects Home Assistant {installed_homeassistant}"
              )

          skipped = os.environ["SKIPPED_PRERELEASE_OFFICIAL"]
          skipped_summary = (
              f"`{skipped}` (target HA prerelease)" if skipped else "None"
          )

          python_version = subprocess.check_output(
              [os.environ["CANARY_PYTHON"], "--version"], text=True
          ).strip()
          uv_version = subprocess.check_output(["uv", "--version"], text=True).strip()
          summary = [
              "## Latest Home Assistant compatibility canary",
              "",
              f"- Latest stable HA: `{latest_ha}`",
              f"- Latest stable-versioned OFFICIAL: `{os.environ['LATEST_OFFICIAL']}`",
              f"- Selected stable-pair OFFICIAL: `{installed_official}`",
              f"- HA selected by OFFICIAL: `{installed_homeassistant}`",
              f"- Newer OFFICIAL releases skipped: {skipped_summary}",
              f"- Status: {status}",
              "- Verified official Core origin and no PHACC coinstallation",
              "",
              "| Component | Resolved version |",
              "| --- | --- |",
          ]
          for name in names:
              summary.append(f"| {name} | `{versions[name]}` |")
          summary.append(
              "| OFFICIAL Home Assistant requirement | "
              f"`homeassistant=={required_homeassistant}` |"
          )
          summary.append(f"| Python | `{python_version}` |")
          summary.append(f"| uv | `{uv_version}` |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("\n".join(summary) + "\n")
          PY

      - name: Run full test suite
        shell: bash
        env:
          HA_COMPATIBILITY_CANARY: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: |
          set -euo pipefail
          "$CANARY_PYTHON" -m pytest -q -p no:cacheprovider -p no:respx
