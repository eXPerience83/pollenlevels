name: PR secret scan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR merge result and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install audited Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          # Same v8.30.1 commit and module path as the historical audit.
          GOTOOLCHAIN=auto go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e
          scanner="$(go env GOPATH)/bin/gitleaks"
          "$scanner" version
          printf '%s\n' "$(dirname "$scanner")" >> "$GITHUB_PATH"

      - name: Verify scanner and scan exact PR history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workspace="$PWD"
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/gitleaks-scan.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          # Use the pinned binary's embedded rules for both fixtures and PRs.
          printf '%s\n' '[extend]' 'useDefault = true' > "$scratch/rules.toml"
          touch "$scratch/empty-ignore"

          # Observe the actual Git child invoked by the pinned scanner.
          # Other Git commands are passed through without changing their output.
          real_git="$(command -v git)"
          mkdir "$scratch/git-wrapper"
          cat > "$scratch/git-wrapper/git" <<'SH'
          #!/bin/bash
          set -euo pipefail
          if [[ "${1-}" == -C && "${2-}" == "$SCAN_GIT_SOURCE" && "${3-}" == log ]]; then
            rc=0
            "$SCAN_REAL_GIT" "$@" || rc=$?
            printf '%s\n' "$rc" >> "$SCAN_GIT_STATUS"
            exit "$rc"
          fi
          exec "$SCAN_REAL_GIT" "$@"
          SH
          chmod 700 "$scratch/git-wrapper/git"

          scan_range() {
            local source="$1" base="$2" tip="$3" target="$4"
            local scanner_git="${5:-$real_git}" rc=0
            local status="$target.git-status" diagnostics="$target.diagnostics"
            # Import only Git objects into a fresh bare repo. Gitleaks also
            # auto-loads source/.gitleaksignore even with an explicit ignore
            # path; never point it at an untrusted checkout.
            git init --bare -q "$target" || return 1
            git -C "$target" fetch -q --no-tags "$source" "$tip" >/dev/null 2>&1 || return 1
            git -C "$target" update-ref refs/heads/scan "$tip" || return 1
            git -C "$target" symbolic-ref HEAD refs/heads/scan || return 1
            git -C "$target" merge-base --is-ancestor "$base" "$tip" || return 1
            # Force text patches despite repository attributes, and do not
            # honor inline suppressions or checkout-controlled ignore files.
            PATH="$scratch/git-wrapper:$PATH" SCAN_REAL_GIT="$scanner_git" \
              SCAN_GIT_SOURCE="$target" SCAN_GIT_STATUS="$status" \
              gitleaks git --no-banner --redact=100 --exit-code=23 --log-level=error \
              --config="$scratch/rules.toml" \
              --gitleaks-ignore-path="$scratch/empty-ignore" \
              --ignore-gitleaks-allow \
              --log-opts="$base..$tip --diff-merges=first-parent --text --no-ext-diff --no-textconv" \
              "$target" >"$diagnostics" 2>&1 || rc=$?
            if [[ ! -f "$status" || "$(cat "$status")" != 0 || -s "$diagnostics" ]]; then
              return 1
            fi
            return "$rc"
          }

          fixture="$scratch/fixture"
          git init -q "$fixture"
          git -C "$fixture" config user.name "CI fixture"
          git -C "$fixture" config user.email "ci@example.invalid"
          git -C "$fixture" commit -q --allow-empty -m baseline
          baseline="$(git -C "$fixture" rev-parse HEAD)"
          printf '%s\n' 'ordinary test text' > "$fixture/example.txt"
          git -C "$fixture" add example.txt
          git -C "$fixture" commit -qm clean
          scan_range "$fixture" "$baseline" "$(git -C "$fixture" rev-parse HEAD)" "$scratch/clean.git"

          # Regression: a scanner-owned Git log that exits without stderr
          # must fail even when Gitleaks itself would report success.
          cat > "$scratch/failing-git" <<'SH'
          #!/bin/bash
          set -euo pipefail
          if [[ "${1-}" == -C && "${3-}" == log ]]; then
            exit 42
          fi
          exec "$SCAN_TEST_REAL_GIT" "$@"
          SH
          chmod 700 "$scratch/failing-git"
          export SCAN_TEST_REAL_GIT="$real_git"
          rc=0
          scan_range "$fixture" "$baseline" "$(git -C "$fixture" rev-parse HEAD)" \
            "$scratch/failing.git" "$scratch/failing-git" || rc=$?
          unset SCAN_TEST_REAL_GIT
          if [[ "$rc" != 1 || ! -f "$scratch/failing.git.git-status" ||
                "$(cat "$scratch/failing.git.git-status")" != 42 ]]; then
            echo "::error::Silent Git failure scanner self-test failed."
            exit 1
          fi

          # Deliberately synthetic, never issued. Split the prefix and body
          # so the scanner does not mistake this workflow for a credential.
          synthetic() {
            printf '%s%s' 'ghp_' 'aB3dE5fG7hJ9kL2mN4pQ6rS8tU0vW1xY3zA5'
          }
          synthetic > "$fixture/example.txt"
          printf '\n' >> "$fixture/example.txt"
          git -C "$fixture" commit -qam "synthetic positive"
          git -C "$fixture" rm -q example.txt
          git -C "$fixture" commit -qm removal
          rc=0
          scan_range "$fixture" "$baseline" "$(git -C "$fixture" rev-parse HEAD)" "$scratch/history.git" || rc=$?
          if [[ "$rc" != 23 ]]; then
            echo "::error::Historical-positive scanner self-test failed (exit $rc)."
            exit 1
          fi

          # Separate history from the ordinary positive: a prior finding
          # cannot mask a regression in the hostile-policy fixture.
          git -C "$fixture" reset --hard -q "$baseline"
          printf '%s\n' 'credentials.txt -diff' > "$fixture/.gitattributes"
          printf '%s\n' '[extend]' 'useDefault = true' '[[allowlists]]' "regexes = ['.*']" > "$fixture/.gitleaks.toml"
          { synthetic; printf '%s\n' ' #gitleaks:allow'; } > "$fixture/credentials.txt"
          git -C "$fixture" add .gitattributes .gitleaks.toml credentials.txt
          git -C "$fixture" commit -qm "synthetic policy bypass fixture"
          finding_commit="$(git -C "$fixture" rev-parse HEAD)"
          printf '%s:credentials.txt:github-pat:1\n' "$finding_commit" > "$fixture/.gitleaksignore"
          git -C "$fixture" add .gitleaksignore
          git -C "$fixture" rm -q credentials.txt
          git -C "$fixture" commit -qm "remove synthetic positive and add ignore"
          rc=0
          scan_range "$fixture" "$baseline" "$(git -C "$fixture" rev-parse HEAD)" "$scratch/hostile.git" || rc=$?
          if [[ "$rc" != 23 ]]; then
            echo "::error::Hostile-policy scanner self-test failed (exit $rc)."
            exit 1
          fi
          echo "Clean, silent-Git-failure, historical-positive and hostile-policy fixtures passed."

          # Fail closed if the checkout is not the exact tested merge result.
          for sha in "$BASE_SHA" "$HEAD_SHA" "$MERGE_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$sha^{commit}"
          done
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
          [[ "$(git rev-parse HEAD^1)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse HEAD^2)" == "$HEAD_SHA" ]]
          git merge-base --is-ancestor "$BASE_SHA" "$MERGE_SHA"
          rc=0
          scan_range "$workspace" "$BASE_SHA" "$MERGE_SHA" "$scratch/pr.git" || rc=$?
          case "$rc" in
            0) echo "No findings in the PR commit range." ;;
            23)
              echo "::error::Potential secret detected. Review privately, revoke/rotate if real, and remove it from the introduced history."
              exit 1 ;;
            *)
              echo "::error::Secret scanner failed (exit $rc)."
              exit 1 ;;
          esac
