name: Marketplace catalog validation (HACS action)

on:
  push:
    branches: [main, prep/5.0-ha-2026.10.4]
  pull_request:
    branches: [main, prep/5.0-ha-2026.10.4]
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

# Marketplace still uses the HACS catalog, hacs.json and hacs/action.
# No checkout needed; the catalog action validates repo metadata remotely.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa" # main
        with:
          category: "integration"
