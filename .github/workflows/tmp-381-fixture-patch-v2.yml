name: Temporary PR 381 fixture patch v2

on:
  push:
    branches:
      - chore/374-runtime-fallback-followup
    paths:
      - .github/workflows/tmp-381-fixture-patch-v2.yml

permissions:
  contents: write

jobs:
  patch-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/374-runtime-fallback-followup
          persist-credentials: true

      - name: Patch runtime fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return updated

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          def replace_in_test(
              text: str,
              name: str,
              replacements: list[tuple[str, str, int]],
              *,
              is_async: bool = False,
          ) -> str:
              prefix = "async def" if is_async else "def"
              marker = f"{prefix} {name}("
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"{name}: function not found")
              next_sync = text.find("\n\ndef test_", start + len(marker))
              next_async = text.find("\n\n@pytest.mark.asyncio", start + len(marker))
              candidates = [value for value in (next_sync, next_async) if value >= 0]
              end = min(candidates) if candidates else len(text)
              segment = text[start:end]
              for old, new, expected in replacements:
                  count = segment.count(old)
                  if count != expected:
                      raise SystemExit(
                          f"{name}: expected {expected} matches for {old!r}, found {count}"
                      )
                  segment = segment.replace(old, new)
              return text[:start] + segment + text[end:]

          init_path = Path("tests/test_init.py")
          init_text = init_path.read_text(encoding="utf-8")

          fake_entry_replacement = '''_DEFAULT_ENTRY_VERSION = object()


          class _FakeEntry:
              def __init__(
                  self,
                  integration: types.ModuleType,
                  *,
                  entry_id: str = "entry-1",
                  title: str = "Pollen Levels",
                  data: dict | None = None,
                  options: dict | None = None,
                  version: object = _DEFAULT_ENTRY_VERSION,
                  subentries: dict | None = None,
                  unique_id: str | None = None,
              ):
                  uses_current_shape = version is _DEFAULT_ENTRY_VERSION
                  self.entry_id = entry_id
                  self.title = title
                  self.domain = integration.DOMAIN
                  if data is None:
                      self.data = (
                          {integration.CONF_API_KEY: "key"}
                          if uses_current_shape
                          else {
                              integration.CONF_API_KEY: "key",
                              integration.CONF_LATITUDE: 1.0,
                              integration.CONF_LONGITUDE: 2.0,
                          }
                      )
                  else:
                      self.data = data
                  self.options = options or {}
                  self.version = (
                      integration.TARGET_ENTRY_VERSION if uses_current_shape else version
                  )
                  if subentries is not None:
                      self.subentries = subentries
                  elif uses_current_shape:
                      latitude = self.data.get(
                          integration.CONF_LATITUDE, 1.0 if data is None else None
                      )
                      longitude = self.data.get(
                          integration.CONF_LONGITUDE, 2.0 if data is None else None
                      )
                      self.subentries = (
                          {
                              entry_id: integration.ConfigSubentry(
                                  data={
                                      integration.CONF_LATITUDE: latitude,
                                      integration.CONF_LONGITUDE: longitude,
                                  },
                                  subentry_id=entry_id,
                                  title=title,
                              )
                          }
                          if latitude is not None and longitude is not None
                          else {}
                      )
                  else:
                      self.subentries = {}
                  self.unique_id = unique_id
                  self.runtime_data = None
          '''
          init_text = sub_once(
              init_text,
              r"class _FakeEntry:\n(?:[^\n]*\n)*?        self\.runtime_data = None\n",
              fake_entry_replacement,
              "test_init _FakeEntry",
          )

          init_text = replace_in_test(
              init_text,
              "test_force_update_refreshes_different_parents_concurrently",
              [
                  (
                      '    entry1 = _FakeEntry(integration, entry_id="entry-1")\n'
                      '    entry2 = _FakeEntry(integration, entry_id="entry-2")',
                      '    entry1 = _FakeEntry(\n'
                      '        integration,\n'
                      '        entry_id="entry-1",\n'
                      '        data={integration.CONF_API_KEY: "key"},\n'
                      '        subentries=_location_subentries(integration, "loc-1"),\n'
                      '    )\n'
                      '    entry2 = _FakeEntry(\n'
                      '        integration,\n'
                      '        entry_id="entry-2",\n'
                      '        data={integration.CONF_API_KEY: "key"},\n'
                      '        subentries=_location_subentries(integration, "loc-2"),\n'
                      '    )',
                      1,
                  )
              ],
          )

          init_text = replace_in_test(
              init_text,
              "test_force_update_continues_after_different_parent_failure",
              [
                  (
                      '    entry1 = _FakeEntry(integration, entry_id="entry-failing")\n'
                      '    entry2 = _FakeEntry(integration, entry_id="entry-ok")',
                      '    entry1 = _FakeEntry(\n'
                      '        integration,\n'
                      '        entry_id="entry-failing",\n'
                      '        data={integration.CONF_API_KEY: "key"},\n'
                      '        subentries=_location_subentries(integration, "loc-failing"),\n'
                      '    )\n'
                      '    entry2 = _FakeEntry(\n'
                      '        integration,\n'
                      '        entry_id="entry-ok",\n'
                      '        data={integration.CONF_API_KEY: "key"},\n'
                      '        subentries=_location_subentries(integration, "loc-ok"),\n'
                      '    )',
                      1,
                  )
              ],
          )

          init_text = replace_in_test(
              init_text,
              "test_force_update_refreshes_fallback_location_without_subentries",
              [
                  (
                      "test_force_update_refreshes_fallback_location_without_subentries",
                      "test_force_update_skips_parent_only_runtime_location_without_subentries",
                      1,
                  ),
                  (
                      '"""force_update should still refresh legacy fallback runtime locations."""',
                      '"""force_update should skip parent-only runtime locations without subentries."""',
                      1,
                  ),
                  ("    assert coordinator.calls == 1", "    assert coordinator.calls == 0", 1),
                  (
                      '    assert "Skipping stale Pollen Levels runtime location" not in caplog.text',
                      '    assert (\n'
                      '        "Skipping stale Pollen Levels runtime location entry-legacy "\n'
                      '        "for entry entry-legacy"\n'
                      '    ) in caplog.text',
                      1,
                  ),
              ],
          )
          init_path.write_text(init_text, encoding="utf-8")

          sensor_path = Path("tests/test_sensor.py")
          sensor_text = sensor_path.read_text(encoding="utf-8")
          sensor_entry_replacement = '''class FakeConfigEntry:
              """ConfigEntry stub exposing data/options/entry_id/subentries."""

              def __init__(
                  self,
                  *,
                  data: dict[str, Any],
                  options: dict[str, Any] | None = None,
                  entry_id: str = "entry",
                  subentries: dict[str, Any] | None = None,
              ) -> None:
                  self.data = data
                  self.options = options or {}
                  self.entry_id = entry_id
                  if subentries is not None:
                      self.subentries = subentries
                  elif "latitude" in data and "longitude" in data:
                      self.subentries = {
                          entry_id: types.SimpleNamespace(
                              subentry_id=entry_id,
                              subentry_type="location",
                              data={
                                  "latitude": data["latitude"],
                                  "longitude": data["longitude"],
                              },
                          )
                      }
                  else:
                      self.subentries = {}
                  self.runtime_data = None
          '''
          sensor_text = sub_once(
              sensor_text,
              r"class FakeConfigEntry:\n(?:[^\n]*\n)*?        self\.runtime_data = None\n",
              sensor_entry_replacement,
              "test_sensor FakeConfigEntry",
          )

          for test_name in (
              "test_setup_entry_accepts_current_day_plant_prefix_without_date",
              "test_setup_entry_debug_logs_do_not_expose_coordinate_identity",
          ):
              sensor_text = replace_in_test(
                  sensor_text,
                  test_name,
                  [
                      ('subentry_id="legacy"', 'subentry_id="entry"', 2),
                      ('"legacy": types.SimpleNamespace(', '"entry": types.SimpleNamespace(', 1),
                  ],
                  is_async=True,
              )

          sensor_path.write_text(sensor_text, encoding="utf-8")
          PY

          python -m py_compile tests/test_init.py tests/test_sensor.py
          git diff --check
          git diff -- tests/test_init.py tests/test_sensor.py

      - name: Commit fixture updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_init.py tests/test_sensor.py
          git diff --cached --check
          git commit -m "test: align runtime fixtures with location subentries"
          git push origin HEAD:chore/374-runtime-fallback-followup
