name: Temporary PR 381 fixture patch

on:
  push:
    branches:
      - chore/374-runtime-fallback-followup
    paths:
      - .github/workflows/tmp-381-fixture-patch.yml

permissions:
  contents: write

jobs:
  patch-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/374-runtime-fallback-followup
          persist-credentials: true

      - name: Patch runtime fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          def replace_in_async_test(
              text: str,
              name: str,
              replacements: list[tuple[str, str, int]],
          ) -> str:
              marker = f"async def {name}("
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"{name}: function not found")
              next_test = text.find("\n\n@pytest.mark.asyncio", start + len(marker))
              end = next_test if next_test >= 0 else len(text)
              segment = text[start:end]
              for old, new, expected in replacements:
                  count = segment.count(old)
                  if count != expected:
                      raise SystemExit(
                          f"{name}: expected {expected} matches for {old!r}, found {count}"
                      )
                  segment = segment.replace(old, new)
              return text[:start] + segment + text[end:]

          init_path = Path("tests/test_init.py")
          init_text = init_path.read_text(encoding="utf-8")

          old_fake_entry = '''class _FakeEntry:
              def __init__(
                  self,
                  integration: types.ModuleType,
                  *,
                  entry_id: str = "entry-1",
                  title: str = "Pollen Levels",
                  data: dict | None = None,
                  options: dict | None = None,
                  version: int = 1,
                  subentries: dict | None = None,
                  unique_id: str | None = None,
              ):
                  self.entry_id = entry_id
                  self.title = title
                  self.domain = integration.DOMAIN
                  self.data = data or {
                      integration.CONF_API_KEY: "key",
                      integration.CONF_LATITUDE: 1.0,
                      integration.CONF_LONGITUDE: 2.0,
                  }
                  self.options = options or {}
                  self.version = version
                  self.subentries = subentries or {}
                  self.unique_id = unique_id
                  self.runtime_data = None
          '''
          new_fake_entry = '''_DEFAULT_ENTRY_VERSION = object()


          class _FakeEntry:
              def __init__(
                  self,
                  integration: types.ModuleType,
                  *,
                  entry_id: str = "entry-1",
                  title: str = "Pollen Levels",
                  data: dict | None = None,
                  options: dict | None = None,
                  version: object = _DEFAULT_ENTRY_VERSION,
                  subentries: dict | None = None,
                  unique_id: str | None = None,
              ):
                  uses_current_shape = version is _DEFAULT_ENTRY_VERSION
                  self.entry_id = entry_id
                  self.title = title
                  self.domain = integration.DOMAIN
                  if data is None:
                      self.data = (
                          {integration.CONF_API_KEY: "key"}
                          if uses_current_shape
                          else {
                              integration.CONF_API_KEY: "key",
                              integration.CONF_LATITUDE: 1.0,
                              integration.CONF_LONGITUDE: 2.0,
                          }
                      )
                  else:
                      self.data = data
                  self.options = options or {}
                  self.version = (
                      integration.TARGET_ENTRY_VERSION if uses_current_shape else version
                  )
                  if subentries is not None:
                      self.subentries = subentries
                  elif uses_current_shape:
                      latitude = self.data.get(
                          integration.CONF_LATITUDE, 1.0 if data is None else None
                      )
                      longitude = self.data.get(
                          integration.CONF_LONGITUDE, 2.0 if data is None else None
                      )
                      self.subentries = (
                          {
                              entry_id: integration.ConfigSubentry(
                                  data={
                                      integration.CONF_LATITUDE: latitude,
                                      integration.CONF_LONGITUDE: longitude,
                                  },
                                  subentry_id=entry_id,
                                  title=title,
                              )
                          }
                          if latitude is not None and longitude is not None
                          else {}
                      )
                  else:
                      self.subentries = {}
                  self.unique_id = unique_id
                  self.runtime_data = None
          '''
          # Dedent source literals to their actual file indentation.
          import textwrap
          init_text = replace_once(
              init_text,
              textwrap.dedent(old_fake_entry),
              textwrap.dedent(new_fake_entry),
              "test_init _FakeEntry",
          )

          old_concurrent_entries = '''    coordinator1 = _Coordinator()
              coordinator2 = _Coordinator()
              entry1 = _FakeEntry(integration, entry_id="entry-1")
              entry2 = _FakeEntry(integration, entry_id="entry-2")
          '''
          new_concurrent_entries = '''    coordinator1 = _Coordinator()
              coordinator2 = _Coordinator()
              entry1 = _FakeEntry(
                  integration,
                  entry_id="entry-1",
                  data={integration.CONF_API_KEY: "key"},
                  subentries=_location_subentries(integration, "loc-1"),
              )
              entry2 = _FakeEntry(
                  integration,
                  entry_id="entry-2",
                  data={integration.CONF_API_KEY: "key"},
                  subentries=_location_subentries(integration, "loc-2"),
              )
          '''
          init_text = replace_once(
              init_text,
              textwrap.dedent(old_concurrent_entries),
              textwrap.dedent(new_concurrent_entries),
              "different-parent concurrency fixtures",
          )

          old_failure_entries = '''    failing = _FailCoordinator()
              ok = _OkCoordinator()
              entry1 = _FakeEntry(integration, entry_id="entry-failing")
              entry2 = _FakeEntry(integration, entry_id="entry-ok")
          '''
          new_failure_entries = '''    failing = _FailCoordinator()
              ok = _OkCoordinator()
              entry1 = _FakeEntry(
                  integration,
                  entry_id="entry-failing",
                  data={integration.CONF_API_KEY: "key"},
                  subentries=_location_subentries(integration, "loc-failing"),
              )
              entry2 = _FakeEntry(
                  integration,
                  entry_id="entry-ok",
                  data={integration.CONF_API_KEY: "key"},
                  subentries=_location_subentries(integration, "loc-ok"),
              )
          '''
          init_text = replace_once(
              init_text,
              textwrap.dedent(old_failure_entries),
              textwrap.dedent(new_failure_entries),
              "different-parent failure fixtures",
          )

          old_fallback_test = '''def test_force_update_refreshes_fallback_location_without_subentries(
              integration_modules: _InitModules, caplog
          ) -> None:
              """force_update should still refresh legacy fallback runtime locations."""
              integration = integration_modules.integration

              class _Coordinator:
                  def __init__(self) -> None:
                      self.calls = 0

                  async def async_request_refresh(self):
                      self.calls += 1

              coordinator = _Coordinator()
              entry = _FakeEntry(
                  integration,
                  entry_id="entry-legacy",
                  data={
                      integration.CONF_API_KEY: "key",
                      integration.CONF_LATITUDE: 1.0,
                      integration.CONF_LONGITUDE: 2.0,
                  },
                  subentries={},
              )
              entry.runtime_data = types.SimpleNamespace(
                  locations={
                      entry.entry_id: types.SimpleNamespace(
                          subentry_id=entry.entry_id, coordinator=coordinator
                      )
                  }
              )
              hass = _FakeHass(entries=[entry])

              assert asyncio.run(integration.async_setup(hass, {})) is True
              with caplog.at_level("DEBUG"):
                  asyncio.run(hass.services.async_call(integration.DOMAIN, "force_update"))

              assert coordinator.calls == 1
              assert "Skipping stale Pollen Levels runtime location" not in caplog.text
          '''
          new_fallback_test = '''def test_force_update_skips_parent_only_runtime_location_without_subentries(
              integration_modules: _InitModules, caplog
          ) -> None:
              """force_update should skip parent-only runtime locations without subentries."""
              integration = integration_modules.integration

              class _Coordinator:
                  def __init__(self) -> None:
                      self.calls = 0

                  async def async_request_refresh(self):
                      self.calls += 1

              coordinator = _Coordinator()
              entry = _FakeEntry(
                  integration,
                  entry_id="entry-legacy",
                  data={
                      integration.CONF_API_KEY: "key",
                      integration.CONF_LATITUDE: 1.0,
                      integration.CONF_LONGITUDE: 2.0,
                  },
                  subentries={},
              )
              entry.runtime_data = types.SimpleNamespace(
                  locations={
                      entry.entry_id: types.SimpleNamespace(
                          subentry_id=entry.entry_id, coordinator=coordinator
                      )
                  }
              )
              hass = _FakeHass(entries=[entry])

              assert asyncio.run(integration.async_setup(hass, {})) is True
              with caplog.at_level("DEBUG"):
                  asyncio.run(hass.services.async_call(integration.DOMAIN, "force_update"))

              assert coordinator.calls == 0
              assert (
                  "Skipping stale Pollen Levels runtime location entry-legacy "
                  "for entry entry-legacy"
              ) in caplog.text
          '''
          init_text = replace_once(
              init_text,
              textwrap.dedent(old_fallback_test),
              textwrap.dedent(new_fallback_test),
              "obsolete fallback force_update test",
          )
          init_path.write_text(init_text, encoding="utf-8")

          sensor_path = Path("tests/test_sensor.py")
          sensor_text = sensor_path.read_text(encoding="utf-8")
          old_sensor_entry = '''class FakeConfigEntry:
              """ConfigEntry stub exposing data/options/entry_id."""

              def __init__(
                  self,
                  *,
                  data: dict[str, Any],
                  options: dict[str, Any] | None = None,
                  entry_id: str = "entry",
              ) -> None:
                  self.data = data
                  self.options = options or {}
                  self.entry_id = entry_id
                  self.runtime_data = None
          '''
          new_sensor_entry = '''class FakeConfigEntry:
              """ConfigEntry stub exposing data/options/entry_id/subentries."""

              def __init__(
                  self,
                  *,
                  data: dict[str, Any],
                  options: dict[str, Any] | None = None,
                  entry_id: str = "entry",
                  subentries: dict[str, Any] | None = None,
              ) -> None:
                  self.data = data
                  self.options = options or {}
                  self.entry_id = entry_id
                  if subentries is not None:
                      self.subentries = subentries
                  elif "latitude" in data and "longitude" in data:
                      self.subentries = {
                          entry_id: types.SimpleNamespace(
                              subentry_id=entry_id,
                              subentry_type="location",
                              data={
                                  "latitude": data["latitude"],
                                  "longitude": data["longitude"],
                              },
                          )
                      }
                  else:
                      self.subentries = {}
                  self.runtime_data = None
          '''
          sensor_text = replace_once(
              sensor_text,
              textwrap.dedent(old_sensor_entry),
              textwrap.dedent(new_sensor_entry),
              "test_sensor FakeConfigEntry",
          )

          for test_name in (
              "test_setup_entry_accepts_current_day_plant_prefix_without_date",
              "test_setup_entry_debug_logs_do_not_expose_coordinate_identity",
          ):
              sensor_text = replace_in_async_test(
                  sensor_text,
                  test_name,
                  [
                      ('subentry_id="legacy"', 'subentry_id="entry"', 2),
                      ('"legacy": types.SimpleNamespace(', '"entry": types.SimpleNamespace(', 1),
                  ],
              )

          sensor_path.write_text(sensor_text, encoding="utf-8")
          PY

          python -m py_compile tests/test_init.py tests/test_sensor.py
          git diff --check
          git diff -- tests/test_init.py tests/test_sensor.py

      - name: Commit fixture updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_init.py tests/test_sensor.py
          git diff --cached --check
          git commit -m "test: align runtime fixtures with location subentries"
          git push origin HEAD:chore/374-runtime-fallback-followup
