name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock
          cache-suffix: test

      - name: Verify locked test environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group test

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m compileall -q custom_components tests

      - name: Run tests with statement coverage
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m pytest -q \
            --cov=custom_components.pollenlevels \
            --cov-report=term-missing \
            --cov-report=json:coverage.json
          uv run --locked --no-sync python scripts/check_coverage.py coverage.json
