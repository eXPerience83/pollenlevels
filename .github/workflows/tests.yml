name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            .python-version
            pyproject.toml
            uv.lock
          cache-suffix: test

      - name: Verify locked test environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --only-group test

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m compileall -q sitecustomize.py custom_components tests

      - name: Run tests
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m pytest -q
